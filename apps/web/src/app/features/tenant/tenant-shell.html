<div class="shell">
  <header class="app-header">
    <div class="brand">
      <a class="brand-link" [routerLink]="['/t', tenantSlug, 'questionnaires']">Starply Survey</a>
      <t-tag theme="primary" variant="light">{{ tenantSlug }}</t-tag>
    </div>

    <t-menu
      class="main-nav"
      mode="horizontal"
      theme="light"
      [value]="activeMenu()"
      (valueChange)="onMenuChange($event)"
    >
      <t-menu-item value="questionnaires">问卷管理</t-menu-item>
      <t-menu-item value="question-bank">题库</t-menu-item>
    </t-menu>

    <div class="account">
      <span class="account-email">{{ email() || '已登录' }}</span>
      <t-button variant="text" [loading]="loggingOut()" (click)="logout()">退出登录</t-button>
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
