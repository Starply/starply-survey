<div class="shell">
  <header class="app-header">
    <div class="brand">
      <a class="brand-link" [routerLink]="['/t', tenantSlug, 'questionnaires']">Starply Survey</a>
      <t-tag theme="primary" variant="light">{{ tenantSlug }}</t-tag>
    </div>

    <nav class="main-nav">
      <a
        class="nav-item"
        [routerLink]="['/t', tenantSlug, 'questionnaires']"
        routerLinkActive="nav-item-active"
      >
        问卷管理
      </a>
      <a
        class="nav-item"
        [routerLink]="['/t', tenantSlug, 'question-bank']"
        routerLinkActive="nav-item-active"
      >
        题库
      </a>
    </nav>

    <div class="account">
      <span class="account-email">{{ email() || '已登录' }}</span>
      <t-button variant="text" [loading]="loggingOut()" (click)="logout()">退出登录</t-button>
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
