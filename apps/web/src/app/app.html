<div class="shell">
  <header class="header">
    <div class="brand">
      <t-icon name="add" size="24px" />
      <span>Starply Survey</span>
    </div>
    <span class="badge">Angular 22 · TDesign 0.1.0 · 无 Zone</span>
  </header>

  <main class="main">
    <h1>项目骨架已就绪</h1>
    <p class="hint">当前为 SPA 形态，数据层（ORM / MySQL / Redis）尚未接入。</p>

    <section class="panel">
      <h2>组件库连通性</h2>

      <label class="field">
        <span class="field-label">输入框</span>
        <t-input
          [value]="name()"
          (valueChange)="onNameChange($event)"
          placeholder="请输入名称"
          clearable
        />
      </label>

      <p class="echo">你好，{{ displayName() }}</p>

      <div class="actions">
        <t-button theme="primary" (click)="increment()">
          <t-icon tButtonIcon name="add" />
          点击次数 {{ count() }}
        </t-button>
        <t-button variant="outline">次要按钮</t-button>
      </div>
    </section>
  </main>
</div>
